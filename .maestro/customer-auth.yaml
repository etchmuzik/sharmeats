appId: eg.sharmeats.customer
name: Customer authentication smoke
tags:
  - smoke
  - customer
  - authenticated
---
- launchApp:
    clearState: true
- openLink: sharmeats://signin
# iOS asks "Open in "Sharm Eats"?" for custom-scheme links opened from
# outside the app; Android navigates directly. The dialog takes a beat to
# animate in, so wait for it (optional — a no-show is fine), then confirm.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: customer-phone-input
    timeout: 15000
- tapOn:
    id: customer-phone-input
- eraseText
- inputText: ${CUSTOMER_E2E_PHONE}
- tapOn:
    id: customer-send-otp
- extendedWaitUntil:
    visible:
      id: customer-otp-input
    timeout: 20000
- tapOn:
    id: customer-otp-input
- inputText: ${CUSTOMER_E2E_OTP}
- extendedWaitUntil:
    notVisible:
      id: customer-otp-input
    timeout: 20000
- takeScreenshot: .maestro/artifacts/customer-authenticated
