name: CI

# Runs typecheck (all surfaces), tests, and lint (where present) on every PR and
# push to main. Each app installs independently (its own lockfile), so we matrix
# per surface. Mobile typecheck/test scripts are mandatory; Expo SDK
# compatibility is reported but ADVISORY (see that step for why); optional checks
# remain optional for other surfaces.
#
# The database is checked too: migration filenames are a hard gate
# (migration-order), the security/governance suites run against an isolated
# PostgreSQL (database-security-migrations), and a full in-order replay of every
# migration runs advisory inside that job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.surface }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface:
          - apps/customer
          - apps/driver
          - apps/restaurant
          - apps/admin-web
          - apps/merchant-web
          - landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.surface }}/package-lock.json

      - name: Install mobile app (lockfile exact)
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        run: npm ci

      - name: Install non-mobile surface
        if: ${{ !contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface) }}
        working-directory: ${{ matrix.surface }}
        # Prefer a clean, lockfile-exact install; fall back to `npm install` for
        # any surface whose lockfile has drifted (keeps CI unblocking, not silent
        # — the fallback is logged).
        run: npm ci || (echo "::warning::npm ci failed, falling back to npm install" && npm install)

      - name: Require mobile quality scripts
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        run: |
          node -e "const s=require('./package.json').scripts ?? {}; for (const n of ['typecheck','test']) if (!s[n]) throw new Error('Missing required script: '+n)"

      - name: Typecheck
        working-directory: ${{ matrix.surface }}
        run: npm run typecheck --if-present

      - name: Test
        working-directory: ${{ matrix.surface }}
        run: npm test --if-present

      - name: Lint
        working-directory: ${{ matrix.surface }}
        run: npm run lint --if-present

      # Web surfaces only: prove `next build` actually succeeds. Typecheck and
      # lint cannot see prerender failures — admin-web's /login could not
      # prerender without NEXT_PUBLIC_SUPABASE_URL set and CI stayed green
      # (found 2026-07-30). Placeholder values are enough: prerendering only
      # needs the Supabase client to CONSTRUCT, never to connect. The mobile
      # apps are excluded because their build is an EAS concern, not a CI one.
      - name: Build (web surfaces)
        if: contains(fromJSON('["apps/admin-web", "apps/merchant-web", "landing"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      # ADVISORY, not a gate. expo-doctor's dependency-validation check compares
      # installed versions against the latest recommendations WITHIN the SDK
      # rather than against a fixed floor, so it starts failing the moment Expo
      # publishes a patch — on every open PR at once, regardless of what that PR
      # changed. It took main from green to red inside one day (2026-07-29,
      # 12:35 -> 20:18) with no commit in between touching a dependency.
      #
      # Blocking on it therefore gates merges on upstream release timing, not on
      # anything about the diff under review. It still RUNS, and a failure is
      # surfaced as a warning annotation plus a visibly failed step, so real
      # incompatibilities are not silent — the job simply no longer fails.
      #
      # `npx expo install --fix` in the affected app is the remedy when this
      # fires. Everything that genuinely must hold — typecheck, tests, lint — is
      # still a hard gate above.
      - name: Expo compatibility (advisory)
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        continue-on-error: true
        run: |
          npx --yes expo-doctor@1.20.1 || {
            echo "::warning title=Expo SDK drift in ${{ matrix.surface }}::expo-doctor reported issues. This does not fail CI. Fix with: cd ${{ matrix.surface }} && npx expo install --fix"
            exit 1
          }

  # Edge functions run on Deno, not Node — test them separately.
  edge-functions:
    name: edge-functions (deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a full commit SHA (supply-chain safety); v2.0.5.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      # Type-check entrypoints too — deno test only checks the test import graph,
      # so index.ts files would otherwise never be type-checked.
      - name: Type-check edge functions
        run: deno check supabase/functions/
      - name: Test edge functions
        run: deno test --permit-no-files supabase/functions/

  # Filename-only gate on the migration set. No database, no network, seconds to
  # run — so it is a hard gate and sits in its own job rather than behind the
  # Postgres setup below.
  #
  # Two files sharing a numeric prefix cannot both be recorded in the
  # version-keyed migration ledger, so a fresh replay silently loses one. Two
  # already exist (026 and 197); they are grandfathered in
  # scripts/migration-prefix-allow.txt with the remediation left to a human,
  # because renumbering an APPLIED migration changes apply order. This stops a
  # third from ever appearing.
  migration-order:
    name: migration order (filenames)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration prefixes, stems and filename shape
        run: ./scripts/check-migration-order.sh

  database-security-migrations:
    name: database security migrations (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL test runtime
        run: pg_config --version
      - name: Test security and governance migrations in isolated PostgreSQL
        run: ./scripts/test-security-migrations.sh

      # ADVISORY, not a gate — same reasoning as expo-doctor above, for a
      # different reason.
      #
      # This applies all 206 migrations in order to an empty PostgreSQL, which
      # answers the question a restore depends on: can the database be rebuilt
      # from this repository? Today the answer is "205 of 206" — mig 187 seeds a
      # hardcoded production user UUID against an FK to public.users, so it
      # cannot apply to a database that does not already contain that person.
      #
      # Blocking on that would fail every PR for a condition no PR introduced,
      # and would pressure whoever hits it into "fixing" an applied migration —
      # exactly the change class this repo's house rules exist to prevent. It
      # runs, its output is the work item, and it becomes a gate the day it first
      # passes. See FOLLOWUPS and the script's own header.
      #
      # PostGIS is installed here rather than shimmed: five tables have geography
      # columns, and without it the replay would fail for an environment reason
      # that reads as a repository defect.
      - name: Replay every migration onto an empty database (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-$(pg_config --version | awk '{print int($2)}')-postgis-3"
          ./scripts/replay-migrations.sh || {
            echo "::warning title=Fresh migration replay failed::supabase/migrations cannot be applied in order to an empty database. This does not fail CI. Reproduce locally with: ./scripts/replay-migrations.sh"
            exit 1
          }
