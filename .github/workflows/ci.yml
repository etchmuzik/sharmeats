name: CI

# Runs typecheck (all surfaces), tests, and lint (where present) on every PR and
# push to main. Each app installs independently (its own lockfile), so we matrix
# per surface. Mobile typecheck/test scripts are mandatory; Expo SDK
# compatibility is reported but ADVISORY (see that step for why); optional checks
# remain optional for other surfaces.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.surface }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface:
          - apps/customer
          - apps/driver
          - apps/restaurant
          - apps/admin-web
          - apps/merchant-web
          - landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.surface }}/package-lock.json

      - name: Install mobile app (lockfile exact)
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        run: npm ci

      - name: Install non-mobile surface
        if: ${{ !contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface) }}
        working-directory: ${{ matrix.surface }}
        # Prefer a clean, lockfile-exact install; fall back to `npm install` for
        # any surface whose lockfile has drifted (keeps CI unblocking, not silent
        # — the fallback is logged).
        run: npm ci || (echo "::warning::npm ci failed, falling back to npm install" && npm install)

      - name: Require mobile quality scripts
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        run: |
          node -e "const s=require('./package.json').scripts ?? {}; for (const n of ['typecheck','test']) if (!s[n]) throw new Error('Missing required script: '+n)"

      - name: Typecheck
        working-directory: ${{ matrix.surface }}
        run: npm run typecheck --if-present

      - name: Test
        working-directory: ${{ matrix.surface }}
        run: npm test --if-present

      # The customer app's Supabase adapter uses an RPC-backed order path.
      # Its contract script is deliberately separate from Vitest because it
      # stubs the Supabase query builder at its public boundary; a unit-only
      # run cannot catch drift between the adapter and the RPC payload.
      - name: Customer Supabase adapter contracts
        if: matrix.surface == 'apps/customer'
        working-directory: apps/customer
        run: npm run test:adapters

      # TypeScript and unit tests do not execute Metro's production module
      # graph. Export catches a missing native/package export or route-level
      # bundle failure before it reaches an EAS build.
      - name: Customer iOS production export
        if: matrix.surface == 'apps/customer'
        working-directory: apps/customer
        run: npm run export

      - name: Lint
        working-directory: ${{ matrix.surface }}
        run: npm run lint --if-present

      # Web surfaces only: prove `next build` actually succeeds. Typecheck and
      # lint cannot see prerender failures — admin-web's /login could not
      # prerender without NEXT_PUBLIC_SUPABASE_URL set and CI stayed green
      # (found 2026-07-30). Placeholder values are enough: prerendering only
      # needs the Supabase client to CONSTRUCT, never to connect. The mobile
      # apps are excluded because their build is an EAS concern, not a CI one.
      - name: Build (web surfaces)
        if: contains(fromJSON('["apps/admin-web", "apps/merchant-web", "landing"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      # ADVISORY, not a gate. expo-doctor's dependency-validation check compares
      # installed versions against the latest recommendations WITHIN the SDK
      # rather than against a fixed floor, so it starts failing the moment Expo
      # publishes a patch — on every open PR at once, regardless of what that PR
      # changed. It took main from green to red inside one day (2026-07-29,
      # 12:35 -> 20:18) with no commit in between touching a dependency.
      #
      # Blocking on it therefore gates merges on upstream release timing, not on
      # anything about the diff under review. It still RUNS, and real drift is
      # surfaced as a warning annotation plus a visibly failed step, so
      # incompatibilities are not silent — the job simply no longer fails.
      #
      # The step reads WHICH checks failed instead of trusting the exit code,
      # because "Check Expo config for common issues" is a permanent false
      # positive here: each Expo app pairs app.json with an app.config.js that
      # spreads app.json's values and layers only EAS-supplied secrets on top
      # (see any app.config.js header), and the doctor's static check cannot
      # see through the require(). Warning on it drowned the drift signal
      # (every run since 2026-08-05 carried the annotation with zero drift).
      # So: only that check failing, for that reason → step passes clean; the
      # dependency check failing → the drift warning below; any OTHER check
      # failing, or the doctor crashing before it reports checks → a distinct
      # loud warning, never a silent pass.
      #
      # Two sharp edges (both found by adversarial review, verified against
      # the published 1.20.1 bundle) shape the ignore branch:
      #   1. That check groups a SECOND, genuine issue under the same ✖ title:
      #      an explicit expo.sdkVersion in the config ("It appears that
      #      expo.sdkVersion is defined..."). Filtering on the title alone
      #      would silence it forever, so the body text is checked too.
      #   2. The warning is only false while app.config.js really does spread
      #      app.json. If that require() ever disappears, app.json's fields
      #      (bundle id, icons, plugins) silently stop applying — so the
      #      ignore branch first confirms the require is still present.
      # Check titles and body text are matched against expo-doctor 1.20.1
      # exactly — the version is pinned, and a future bump that rewords them
      # lands in the "unexpected check" branch, which is noisy, not silent.
      #
      # `npx expo install --fix` in the affected app is the remedy when the
      # drift warning fires. Everything that genuinely must hold — typecheck,
      # tests, lint — is still a hard gate above.
      - name: Expo compatibility (advisory)
        if: contains(fromJSON('["apps/customer", "apps/driver", "apps/restaurant"]'), matrix.surface)
        working-directory: ${{ matrix.surface }}
        continue-on-error: true
        run: |
          if out="$(npx --yes expo-doctor@1.20.1 2>&1)"; then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          failed="$(printf '%s\n' "$out" | grep -F '✖' || true)"
          if [ -z "$failed" ]; then
            echo "::warning title=expo-doctor did not run in ${{ matrix.surface }}::expo-doctor exited non-zero without reporting any failed check (crash or install failure). See the step log."
            exit 1
          fi
          config_ignorable=0
          if printf '%s\n' "$failed" | grep -Fq 'Check Expo config for common issues'; then
            if printf '%s\n' "$out" | grep -Fq 'expo.sdkVersion is defined'; then
              config_ignorable=0
            elif grep -Fq "require('./app.json')" app.config.js 2>/dev/null; then
              config_ignorable=1
            fi
          fi
          real="$(printf '%s\n' "$failed" | grep -Fv 'Check Expo config for common issues' || true)"
          if [ -z "$real" ] && [ "$config_ignorable" -eq 1 ]; then
            echo "Only the known app.json + app.config.js false positive failed — ignored (see the comment above this step)."
            exit 0
          fi
          if printf '%s\n' "$real" | grep -Fq 'Check that packages match versions required by installed Expo SDK'; then
            echo "::warning title=Expo SDK drift in ${{ matrix.surface }}::expo-doctor reported dependency drift. This does not fail CI. Fix with: cd ${{ matrix.surface }} && npx expo install --fix"
          fi
          unexpected=0
          if printf '%s\n' "$real" | grep -Fv 'Check that packages match versions required by installed Expo SDK' | grep -q .; then
            unexpected=1
          fi
          if printf '%s\n' "$failed" | grep -Fq 'Check Expo config for common issues' && [ "$config_ignorable" -eq 0 ]; then
            unexpected=1
          fi
          if [ "$unexpected" -eq 1 ]; then
            echo "::warning title=Unexpected expo-doctor failure in ${{ matrix.surface }}::a check other than dependency drift and the known app-config false positive failed. See the step log."
          fi
          exit 1

  # Edge functions run on Deno, not Node — test them separately.
  edge-functions:
    name: edge-functions (deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a full commit SHA (supply-chain safety); v2.0.5.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      # Type-check entrypoints too — deno test only checks the test import graph,
      # so index.ts files would otherwise never be type-checked.
      - name: Type-check edge functions
        run: deno check supabase/functions/
      - name: Test edge functions
        run: deno test --permit-no-files supabase/functions/

  database-security-migrations:
    name: database security migrations (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL test runtime
        run: pg_config --version
      - name: Test security and governance migrations in isolated PostgreSQL
        run: ./scripts/test-security-migrations.sh

  # Two guards for failures that every other job in this file was blind to.
  # Both are pure repo inspection: no install, no network, seconds to run.
  repo-integrity:
    name: repo integrity (migrations + easignore)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is not needed — both checks read the working tree only.
      - uses: actions/checkout@v4

      # 2026-08-01: two sessions both correctly read "highest is 201" and both
      # wrote a 202. The collision is a race between concurrent readers, which
      # is why the warning already in CLAUDE.md did not prevent it and a check
      # that runs on both branches does.
      - name: Migration numbers are unique
        run: node scripts/check-migration-numbers.mjs

      # 2026-07-31: an unanchored `supabase/` in .easignore deleted
      # apps/customer/src/data/supabase/ from every EAS upload. Typecheck,
      # tests, lint and expo export all read the working tree and stayed green;
      # the only signal was a failed cloud build ~20 minutes and one credit
      # later. This turns the archive's contents into a CI-time assertion.
      - name: EAS upload keeps the app source
        run: ./scripts/check-easignore.sh
