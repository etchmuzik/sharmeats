# Build the three Expo apps on EAS, on demand.
#
# WHY MANUAL-ONLY: a cloud build costs credits against a monthly cap that,
# per docs/EAS-BUILD-RUNBOOK.md, fails AFTER the project is uploaded — so a
# build that trips the cap wastes the upload and tells you late. Nothing here
# runs on push. You ask for a build, you get a build.
#
# WHY IT WAITS instead of --no-wait: this repository is PUBLIC, so GitHub
# Actions minutes are free, and waiting is what makes the result honest. With
# --no-wait the job exits the moment EAS accepts the job and goes green whether
# or not the build succeeds — the same "green over nothing happened" failure the
# landing deploy had before it verified /version.json. Free minutes buy a true
# answer; take it.
#
# SETUP (one-time, Settings → Secrets and variables → Actions):
#   secrets.EXPO_TOKEN   an Expo access token (expo.dev → Account → Access
#                        tokens). Personal-account token is fine; it needs
#                        access to the three EAS projects.
#
# SENTRY SOURCE MAPS need a second credential, and it is NOT a GitHub secret —
# it is an EAS environment variable named SENTRY_AUTH_TOKEN on the `production`
# environment of each app, because sentry-cli runs on the EAS builder, not here.
# See the preflight step below for the exact command and the two failure modes.
#
# WHAT THIS DOES NOT DO: submit to the App Store or Play. Submission needs the
# ASC API key (.p8) and the Play service-account JSON, which are correctly
# gitignored (`**/credentials/`, `*.p8`, `*service-account*.json`) and are not
# in this repository. Submit from a machine that has them:
#     cd apps/<app> && eas submit --platform ios --profile production --latest
#
# RUNTIME VERSION NOTE — the reason a JS-only fix still needs a full build:
# all three apps use runtimeVersion policy "appVersion" and are at 1.1.0, while
# the binaries on TestFlight were built at 1.0.0. An `eas update` published now
# targets runtime 1.1.0, which no installed app is running, so it would reach
# nobody. Until a 1.1.0 binary is out, OTA is not a shortcut — it is a no-op.

name: EAS build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'all'
        type: choice
        options: [all, customer, driver, restaurant]
      platform:
        description: 'Which platform'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]
      profile:
        description: 'eas.json build profile'
        required: true
        default: 'production'
        type: choice
        options: [production, preview]

concurrency:
  group: eas-build-${{ inputs.app }}-${{ inputs.platform }}
  cancel-in-progress: false # never kill a build that is already burning credits

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.choose.outputs.apps }}
    steps:
      - id: choose
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then
            echo 'apps=["customer","driver","restaurant"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: pick
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one app failing must not cancel the others mid-build
      matrix:
        app: ${{ fromJSON(needs.pick.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Fail here rather than let eas-cli fall through to an interactive
          # login prompt that cannot be answered on a runner and would hang
          # until the job times out.
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN not set::Add an Expo access token as the EXPO_TOKEN repository secret (expo.dev → Account → Access tokens). Nothing was built."
            exit 1
          fi

      # Fail in seconds rather than 20 minutes in.
      #
      # When a profile sets SENTRY_DISABLE_AUTO_UPLOAD=false, the build uploads
      # source maps — which needs SENTRY_AUTH_TOKEN as an EAS environment
      # variable. If it is missing, sentry-cli fails and
      # @sentry/react-native's sentry-xcode.sh does `exit 1`, failing the
      # Xcode build phase.
      #
      # There is no softer landing available: SENTRY_ALLOW_FAILURE, which the
      # script's own error message recommends for exactly this, appears in
      # 7.11.0 only inside message strings and is never read. Verified by
      # grepping the installed package.
      #
      # So the missing-token case would otherwise surface as a full build
      # burning ~20 minutes and a credit before dying at the archive step.
      #
      # THE FAIL-SAFE IS THIS CHECK, NOT A FLAG. Because the upload cannot be
      # made non-fatal inside the build, the only way a Sentry problem never
      # breaks a production build is to refuse to START one that is already
      # doomed. So the two cases are treated differently:
      #
      #   upload ON  + token MISSING  -> hard failure, here, in seconds. The
      #                                  build cannot succeed; failing now saves
      #                                  the credit and says why.
      #   upload OFF + token PRESENT  -> warning. Nothing is broken, but the
      #                                  build is about to ship a binary whose
      #                                  crashes are unreadable minified offsets
      #                                  while the token needed to fix that is
      #                                  sitting right there.
      #
      # An env:list that cannot RUN is neither: that is a CLI/network problem,
      # not an answer about the token, and it warns rather than blocking a build
      # on a flaky list call.
      #
      # It reads the flag out of eas.json rather than assuming a value. The flag
      # has now been flipped twice in one day, and a check that hardcodes what it
      # expects to find starts lying the moment someone changes it — which is
      # precisely when a preflight needs to be trusted.
      #
      # THE SECRET, EXACTLY: an EAS *environment variable* named
      # SENTRY_AUTH_TOKEN on the `production` environment of each of the three
      # EAS projects — not a GitHub Actions secret, because it is consumed by
      # sentry-cli on the EAS builder, not on this runner. Create it once per app:
      #
      #   cd apps/<app> && npx eas-cli env:create --environment production \
      #     --name SENTRY_AUTH_TOKEN --value <token> --visibility secret
      #
      # Mint the token at sentry.io -> Settings -> Auth Tokens with scopes
      # project:releases and org:read. Org/project are already in eas.json
      # (SENTRY_ORG=beyond-mngmt, SENTRY_PROJECT=sharmeats-<app>).
      - name: Check Sentry source-map upload prerequisites
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          uploads=$(node -p "(require('./eas.json').build?.['${{ inputs.profile }}']?.env?.SENTRY_DISABLE_AUTO_UPLOAD) === 'false' ? 'yes' : 'no'")

          if ! env_list=$(npx eas-cli@21.4.0 env:list --environment production 2>&1); then
            echo "::warning title=Could not check SENTRY_AUTH_TOKEN::eas env:list failed for apps/${{ matrix.app }}, so the Sentry preflight could not run. The build continues. Output: ${env_list}"
            exit 0
          fi

          if echo "$env_list" | grep -q 'SENTRY_AUTH_TOKEN'; then token=present; else token=absent; fi

          if [ "$uploads" = "yes" ] && [ "$token" = "absent" ]; then
            echo "::error title=Sentry source-map upload cannot succeed::eas.json sets SENTRY_DISABLE_AUTO_UPLOAD=false for profile '${{ inputs.profile }}' but SENTRY_AUTH_TOKEN is not set on the production environment of apps/${{ matrix.app }}. sentry-cli would fail and, because SENTRY_ALLOW_FAILURE is not honoured in @sentry/react-native 7.11.0, take the Xcode build phase down with it ~20 minutes and one build credit from now. Create it with: cd apps/${{ matrix.app }} && npx eas-cli env:create --environment production --name SENTRY_AUTH_TOKEN --value <token> --visibility secret"
            exit 1
          fi

          if [ "$uploads" = "yes" ]; then
            echo "SENTRY_AUTH_TOKEN present and upload enabled — source maps will upload."
            exit 0
          fi

          if [ "$token" = "present" ]; then
            echo "::warning title=Source maps are off but the token exists::SENTRY_AUTH_TOKEN is set for apps/${{ matrix.app }}, but eas.json leaves SENTRY_DISABLE_AUTO_UPLOAD=\"true\" for profile '${{ inputs.profile }}', so this binary's crashes will arrive as minified bundle offsets. Set it to \"false\" in apps/${{ matrix.app }}/eas.json to turn uploads on — this preflight now blocks a build that would fail for a missing token, so the flip is safe."
            exit 0
          fi

          echo "Source-map upload is off for profile '${{ inputs.profile }}' and no token is set — nothing to do. Stack traces from this build will be minified."

      # Only packages/* are npm workspaces; every app owns its own lockfile, so
      # install from inside the app directory. (See CLAUDE.md.)
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci || (echo "::warning::npm ci failed, falling back to npm install" && npm install)

      - name: Build
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive
