# Auto-deploy the landing site to Hostinger on every merge to main that
# touches it.
#
# WHY THIS EXISTS: production drifted ~8 WEEKS behind main (June 5 → July 30,
# 2026) and nobody noticed, because scripts/build-hostinger.sh ends with an
# instruction — "upload out/ to public_html/" — not an upload. The build kept
# succeeding locally, the stale site kept serving 200s, and the Play Data
# Safety pages it was missing 404'd quietly the whole time. This workflow makes
# that failure mode structurally impossible: merging IS deploying.
#
# SETUP (one-time, in GitHub → Settings → Secrets and variables → Actions):
#   secrets.HOSTINGER_FTP_HOST      ftp.sharmeats.online
#   secrets.HOSTINGER_FTP_USERNAME  the FTP account (hPanel → Files → FTP Accounts)
#   secrets.HOSTINGER_FTP_PASSWORD  its password
#   vars.HOSTINGER_FTP_SERVER_DIR   optional; where out/ lands, RELATIVE TO THE
#                                   FTP ACCOUNT'S ROOT. Defaults to "." — see below.
#
# WHY THE DEFAULT IS "." AND NOT "public_html": a Hostinger FTP sub-account is
# CHROOTED to the directory shown in its hPanel row. The account for this site
# lists Directory = /home/u375308597/domains/sharmeats.online/public_html, so it
# logs in already INSIDE public_html — uploading to "public_html" from there
# would produce public_html/public_html, a perfectly successful transfer that
# serves nothing. The default therefore matches the account that actually
# exists. If you point this at the MAIN account (u375308597, rooted at
# /home/u375308597) instead of a domain-scoped sub-account, you must set the
# variable to domains/sharmeats.online/public_html. Either way the verify step
# below catches a wrong guess instead of going green on it.
#
# Until the secrets exist this workflow still runs the BUILD on every relevant
# merge (a free deploy dry-run) and skips the upload with a visible notice —
# so merging this file before configuring secrets breaks nothing.
#
# Transfer notes:
#   * plain lftp over FTPS (ssl-force) — no third-party deploy action, nothing
#     to supply-chain-audit beyond Ubuntu's lftp package.
#   * NO --delete: files the build no longer produces are left in place on the
#     server rather than removed. That is deliberate caution while the server
#     dir setting is young — a wrong HOSTINGER_FTP_SERVER_DIR with --delete
#     would erase whatever it pointed at. Once a few deploys have proven the
#     path, add --delete to the mirror command to also clean orphans (the June
#     build's leftovers are exactly that class).

name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'scripts/check-landing-zones.mjs'
      - 'scripts/write-version-manifest.mjs'
      - '.github/workflows/deploy-landing.yml'
  # Manual runs for out-of-band deploys (e.g. after a zones/migration change
  # that the paths filter cannot see).
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false # never kill a half-finished upload for a newer one

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # Lockfile-exact, same as ci.yml. The old `npm ci || npm install` fallback
      # made the one workflow that actually SHIPS the laxest: a drifted lockfile
      # failed the PR but silently rewrote package-lock.json here, and the
      # deploy then aborted in write-version-manifest.mjs with "working tree is
      # dirty" — pointing at the lockfile instead of naming the real problem.
      - name: Install (lockfile exact)
        working-directory: landing
        run: npm ci

      # The zone check is landing's `npm test` and CI runs it on the PR, but a
      # deploy is the moment it must be true — cheap to re-assert here.
      - name: Zone coverage must match the database
        working-directory: landing
        run: npm test

      - name: Build static export
        working-directory: landing
        run: bash scripts/build-hostinger.sh

      - name: Check deploy credentials
        id: creds
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Build succeeded but HOSTINGER_FTP_* secrets are not set, so nothing was uploaded. Add them in Settings → Secrets → Actions to enable auto-deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload out/ to Hostinger
        if: steps.creds.outputs.configured == 'true'
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_SERVER_DIR_OVERRIDE: ${{ vars.HOSTINGER_FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # ---------------------------------------------------------------
          # Where does out/ go? ASK THE SERVER instead of guessing.
          #
          # This account has two shapes and the right answer differs:
          #   * a domain-scoped SUB-account (u…​.etch) is chrooted to
          #     /home/u…/domains/sharmeats.online/public_html — it logs in
          #     already inside the web root, so the target is "."
          #   * the MAIN account (u…​.sharmeats.online) logs in at /home/u…,
          #     which CONTAINS public_html — so the target is "public_html"
          #
          # Guessing cost one failed deploy already, and the two guesses fail
          # in opposite directions: "." on the main account dumps the site into
          # the home dir, "public_html" on the sub-account nests it as
          # public_html/public_html. Both are transfers that succeed completely
          # and serve nothing. So: list the login directory, and if public_html
          # is in it, that is the web root; otherwise we are already there.
          #
          # An explicit HOSTINGER_FTP_SERVER_DIR variable always wins — this
          # only runs when it is unset.
          # ---------------------------------------------------------------
          LFTP_TLS="set ftp:ssl-force true; set ssl:verify-certificate true; set ssl:check-hostname false;"

          if [ -z "${FTP_SERVER_DIR_OVERRIDE:-}" ]; then
            listing=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
                        -e "$LFTP_TLS cls -1 --classify; quit" "$FTP_HOST" 2>/dev/null || true)
            if printf '%s\n' "$listing" | grep -qx 'public_html/'; then
              FTP_SERVER_DIR=public_html
            else
              FTP_SERVER_DIR=.
            fi
            echo "Detected web root: $FTP_SERVER_DIR (login dir contains: $(printf '%s' "$listing" | tr '\n' ' '))"
          else
            FTP_SERVER_DIR="$FTP_SERVER_DIR_OVERRIDE"
            echo "Using HOSTINGER_FTP_SERVER_DIR override: $FTP_SERVER_DIR"
          fi
          # FTPS enforced: credentials must never travel plaintext.
          #
          # verify-certificate STAYS ON. check-hostname is off, and the two are
          # deliberately separate settings rather than one switch:
          #
          #   * verify-certificate — does the cert chain to a CA the runner
          #     trusts? Still required. A self-signed interceptor fails here.
          #   * check-hostname — does the cert's CN/SAN equal the host we dialled?
          #     Off, because on Hostinger SHARED hosting it structurally cannot
          #     match: the FTP server presents the certificate for the shared
          #     node, not for a customer domain, so ftp.sharmeats.online will
          #     never appear in it. The first real deploy failed exactly here:
          #       "certificate common name doesn't match requested host name"
          #
          # This is a genuine, bounded reduction in assurance — an attacker
          # holding ANY CA-issued cert could now impersonate the server, where
          # before they would have needed one for this exact name. It is not the
          # same as turning TLS off: the session is still encrypted and the peer
          # still needs a real CA signature. Restore check-hostname the day this
          # moves to a host whose cert names it (a VPS, or SFTP over its own
          # key), and prefer that if the choice ever comes up.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
               -e "$LFTP_TLS mirror -R --verbose --parallel=4 landing/out/ $FTP_SERVER_DIR; quit" \
               "$FTP_HOST"

      - name: Verify the live site took the deploy
        if: steps.creds.outputs.configured == 'true'
        run: |
          # A 200 ON THE HOMEPAGE PROVES NOTHING. That was this step's original
          # check, and it was worthless for the failure it was meant to catch:
          # if HOSTINGER_FTP_SERVER_DIR points somewhere wrong, the upload lands
          # in a directory nobody serves and the OLD site keeps answering 200 —
          # so the deploy goes green while production is untouched. That is the
          # same silent-staleness this entire workflow was written to kill.
          #
          # The build stamps out/version.json with the commit being built, so
          # ask the live site which commit it is running and require it to be
          # THIS one. Only bytes that actually landed where Apache serves them
          # can satisfy that.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://sharmeats.online/)
          echo "sharmeats.online → $code"
          [ "$code" = "200" ] || exit 1

          # Shared hosting may sit behind a cache; a couple of retries is the
          # difference between a real failure and a flaky one.
          for attempt in 1 2 3; do
            live=$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' \
                     "https://sharmeats.online/version.json?cb=${GITHUB_SHA}" \
                   | jq -r '.commit // empty' 2>/dev/null || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            echo "attempt $attempt: live=/version.json commit=${live:-<none>}, want $GITHUB_SHA"
            sleep 10
          done

          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error title=Deploy did not land::sharmeats.online is serving commit '${live:-<no version.json>}' but this run deployed $GITHUB_SHA. The upload most likely went to the wrong directory — set the HOSTINGER_FTP_SERVER_DIR variable to match the FTP account's root. A domain-scoped sub-account is chrooted to public_html, so the correct value is '.' (the default); the main account (u375308597) is rooted at /home/u375308597 and needs 'domains/sharmeats.online/public_html'."
            exit 1
          fi
          echo "✓ sharmeats.online is serving $GITHUB_SHA"
